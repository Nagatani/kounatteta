<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <clipPath id="icon-clip">
      <rect width="512" height="512" rx="112"/>
    </clipPath>
    <filter id="soft-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>

  <g clip-path="url(#icon-clip)">
    <!-- PWA背景 -->
    <rect width="512" height="512" fill="url(#bg-grad)"/>
    <circle cx="96" cy="84" r="190" fill="#ffffff" opacity="0.09"/>

    <!-- 右上の吹き出し（状況説明の図解入り） -->
    <g filter="url(#soft-shadow)">
      <path
        d="M280 50 H432 A42 42 0 0 1 474 92 V212 A42 42 0 0 1 432 254 H318 L254 288 L280 254 A42 42 0 0 1 238 212 V92 A42 42 0 0 1 280 50 Z"
        fill="#ffffff"
        stroke="#0f172a"
        stroke-width="14"
        stroke-linejoin="round"
      />

      <!-- 吹き出し内のミニ状況図：赤い説明カーブ矢印 -->
      <path
        d="M276 196 Q284 118 344 122"
        fill="none"
        stroke="#ef4444"
        stroke-width="12"
        stroke-linecap="round"
      />
      <polygon points="360,124 332,107 336,139" fill="#ef4444"/>
      <circle cx="276" cy="196" r="11" fill="#2563eb"/>

      <!-- 吹き出し内のミニ状況図：オレンジのピクト猫 -->
      <g stroke="#f97316" stroke-linecap="round" stroke-linejoin="round">
        <path d="M370 184 Q352 162 366 142" fill="none" stroke-width="11"/>
        <line x1="378" y1="186" x2="416" y2="186" stroke-width="38"/>
        <line x1="378" y1="198" x2="374" y2="216" stroke-width="12"/>
        <line x1="416" y1="198" x2="420" y2="216" stroke-width="12"/>
        <polygon points="408,150 412,122 428,142" fill="#f97316" stroke="none"/>
        <polygon points="432,142 446,122 448,150" fill="#f97316" stroke="none"/>
        <circle cx="429" cy="160" r="22" fill="#f97316" stroke="none"/>
      </g>
    </g>

    <!-- 左下に大きく配置した白抜きピクトグラム人間（大きな頭＋ひじが曲がって吹き出しを優しく支える太い腕） -->
    <g filter="url(#soft-shadow)">
      <!-- パス1：濃紺の外枠（胴体＋ひじの曲がった太い腕） -->
      <g stroke="#0f172a" stroke-linecap="round" stroke-linejoin="round">
        <!-- バストアップの胴体（左下に見切れる） -->
        <path
          d="M-40 556 V446 C-40 386 14 358 88 358 C156 358 202 390 202 448 V556 Z"
          fill="#0f172a"
          stroke-width="28"
        />
        <!-- ひじが少し曲がって吹き出しの下を優しく支える太い腕 -->
        <path d="M154 416 Q266 446 364 316" fill="none" stroke-width="82"/>
      </g>

      <!-- パス2：白抜き内側（継ぎ目なし） -->
      <g stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
        <path
          d="M-40 556 V446 C-40 386 14 358 88 358 C156 358 202 390 202 448 V556 Z"
          fill="#ffffff"
          stroke-width="0"
        />
        <path d="M154 416 Q266 446 364 316" fill="none" stroke-width="54"/>
      </g>

      <!-- とても大きな頭（直径252px・左側に見切れるダイナミックな配置） -->
      <circle cx="88" cy="218" r="126" fill="#ffffff" stroke="#0f172a" stroke-width="14"/>
    </g>
  </g>
</svg>
